name: Deploy Quartz Site from Obsidian Vault

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Optionnel : Exécuter toutes les nuits ou sur déclenchement externe
  repository_dispatch:
    types: [obsidian_updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Obsidian Vault into content/
        uses: actions/checkout@v4
        with:
          repository: 'ColinLath/DnD-Dragonlance-Obsidian' # <--- À MODIFIER
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          path: 'content'

      - name: Fetch Quartz history
        run: git fetch --unshallow || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4